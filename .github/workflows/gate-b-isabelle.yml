name: Gate B — Isabelle/ZF infinity proof

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/gates/b/**'
      - 'research/foundations-v0.2/**'
      - 'scripts/foundation_probe_v02.py'
      - 'scripts/isabelle_premises_v02.py'
      - 'scripts/generate_prover_bridge_v03.py'
      - 'scripts/check_prover_bridge_v03.py'
      - 'scripts/tests/test_prover_bridge_v03.py'
      - 'scripts/tests/test_foundation_probe_v02.py'
      - '.github/workflows/gate-b-isabelle.yml'
  push:
    branches: [main]
    paths:
      - 'research/gates/b/**'
      - 'research/foundations-v0.2/**'
      - 'scripts/foundation_probe_v02.py'
      - 'scripts/isabelle_premises_v02.py'
      - 'scripts/generate_prover_bridge_v03.py'
      - 'scripts/check_prover_bridge_v03.py'
      - 'scripts/tests/test_prover_bridge_v03.py'
      - 'scripts/tests/test_foundation_probe_v02.py'
      - '.github/workflows/gate-b-isabelle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-zf:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Verify Gate B evidence classifications
        run: |
          python3 -m unittest scripts.tests.test_foundation_gate_b -v
          python3 scripts/check_foundation_gate_b.py --check
          python3 -m unittest scripts.tests.test_prover_bridge_v03 -v
          python3 scripts/generate_prover_bridge_v03.py --check
      - name: Fetch Isabelle2026
        run: docker pull makarius/isabelle:Isabelle2026
      - name: Prepare user heap
        run: mkdir -p isabelle-home && chmod 777 isabelle-home
      - name: Verify statements inside the ZF object logic
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/research/gates/b:/theories:ro" \
            -v "$PWD/isabelle-home:/home/isabelle/.isabelle" \
            makarius/isabelle:Isabelle2026 build -v \
              -d /theories GateB_ZF 2>&1 | tee gate-b-zf.log
      - name: Extract prover-produced theorem statement export
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p isabelle-exports && chmod 777 isabelle-exports
          docker run --rm \
            -v "$PWD/research/gates/b:/theories:ro" \
            -v "$PWD/isabelle-home:/home/isabelle/.isabelle" \
            -v "$PWD/isabelle-exports:/exports" \
            makarius/isabelle:Isabelle2026 export -n \
              -d /theories \
              -O /exports \
              -x "GateB_ZF.GateB_ProverBridge:axiomscope_theorems.tsv" \
              GateB_ZF
          python3 scripts/check_prover_bridge_v03.py \
            --export isabelle-exports/GateB_ZF.GateB_ProverBridge/axiomscope_theorems.tsv \
            --output isabelle-exports/prover-certified-scenarios.json
      - name: Upload prover statement and scenario evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axiomscope-v03-prover-evidence
          path: isabelle-exports/
          if-no-files-found: ignore
      - name: Upload Isabelle build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-b-zf-build
          path: gate-b-zf.log
          if-no-files-found: ignore
