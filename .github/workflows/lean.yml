name: Lean verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  proof-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: "true"
          test: "false"
      - name: Test ledger generator
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Check generated proof records against Lean
        run: python3 scripts/generate_proof_ledger.py --check
