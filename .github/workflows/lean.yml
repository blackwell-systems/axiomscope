name: Lean verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  proof-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: "true"
          test: "false"
      - name: Check generalized Kripke experiment
        run: lake env lean Axiomscope/Experiments/GeneralKripke.lean
      - name: Check natural number reconstruction
        run: lake env lean Axiomscope/Experiments/NaturalNumbers.lean
      - name: Check Peano axiom reconstruction
        run: lake env lean Axiomscope/Experiments/PeanoAxioms.lean
      - name: Check first-order arithmetic experiment
        run: lake env lean Axiomscope/Experiments/FirstOrderArithmetic.lean
      - name: Check comparative infinity experiment
        run: lake env lean Axiomscope/Experiments/ComparativeInfinity.lean
      - name: Check verified logical interpretations (Experiment 008)
        run: lake env lean Axiomscope/FoundationalInterpretations.lean && lake env lean Axiomscope/Experiments/Experiment008.lean
      - name: Check nonidentity interpretation and semantic equivalence (Experiment 009)
        run: lake env lean Axiomscope/Experiments/Experiment009.lean
      - name: Test ledger generator
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Check generated proof records against Lean
        run: python3 scripts/generate_proof_ledger.py --check
      - name: Check generated comparison report
        run: python3 scripts/build_comparison.py --check
