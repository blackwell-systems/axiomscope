name: Foundations v0.2 — assumption applicability

on:
  push:
    branches: [main]
    paths:
      - 'scripts/foundation_probe_v02.py'
      - 'scripts/isabelle_premises_v02.py'
      - 'scripts/tests/test_foundation_probe_v02.py'
      - 'research/foundations-v0.2/**'
      - 'research/gates/b/**'
      - '.github/workflows/foundations-v02.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/foundation_probe_v02.py'
      - 'scripts/isabelle_premises_v02.py'
      - 'scripts/tests/test_foundation_probe_v02.py'
      - 'research/foundations-v0.2/**'
      - 'research/gates/b/**'
      - '.github/workflows/foundations-v02.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate Gate B evidence classifications
        run: |
          python3 -m unittest scripts.tests.test_foundation_gate_b -v
          python3 scripts/check_foundation_gate_b.py --check
      - name: Validate Foundations v0.2 interpretation limits
        run: python3 -m unittest scripts.tests.test_foundation_probe_v02 -v
      - name: Ensure reproducible counterfactual report
        run: python3 scripts/foundation_probe_v02.py --check
