name: Gate A — Isabelle kernel replay

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'research/gates/a/**'
      - 'scripts/check_foundation_gate_a.py'
      - 'scripts/tests/test_foundation_gate_a.py'
      - '.github/workflows/gate-a-isabelle.yml'

permissions:
  contents: read

jobs:
  replay-foundations:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned AFP 2026 (sparse)
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout --sparse https://github.com/isabelle-prover/mirror-afp-2026.git afp
          git -C afp checkout --detach 3630b347b74dc3f44707bda24c7a5fd0486c6474
          git -C afp sparse-checkout set thys/HereditarilyFinite thys/ZF_finite
          echo "AFP pinned git commit: $(git -C afp rev-parse HEAD)"
          test "$(git -C afp rev-parse HEAD)" = "3630b347b74dc3f44707bda24c7a5fd0486c6474"

      - name: Fetch official Isabelle2026 headless release
        run: docker pull makarius/isabelle:Isabelle2026

      - name: Prepare writable Isabelle user heap directory
        shell: bash
        run: |
          mkdir -p isabelle-home
          chmod 777 isabelle-home

      - name: Replay positive foundation — Isabelle/ZF session
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/isabelle-home:/home/isabelle/.isabelle" \
            makarius/isabelle:Isabelle2026 build -v -b ZF \
              2>&1 | tee zf-build.log

      - name: Replay negative foundation — AFP ZF_finite / HF model
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/afp/thys:/afp/thys:ro" \
            -v "$PWD/isabelle-home:/home/isabelle/.isabelle" \
            makarius/isabelle:Isabelle2026 build -v \
              -d /afp/thys/HereditarilyFinite \
              -d /afp/thys/ZF_finite \
              ZF_finite 2>&1 | tee zffin-build.log

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-a-isabelle-build
          path: |
            zf-build.log
            zffin-build.log
          if-no-files-found: ignore
